name: Validate team permission access

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tournament access model
        run: |
          python3 <<'PY'
          from pathlib import Path
          s=Path('app.v11.0.0.js').read_text(encoding='utf-8')
          required=[
            "client.rpc('has_team_permission'",
            "async function getTournaments()",
            "async function getTournament(id)"
          ]
          missing=[x for x in required if x not in s]
          if missing:
            raise SystemExit("Missing required tournament access code: "+", ".join(missing))
          print("Tournament access model OK")
          PY
